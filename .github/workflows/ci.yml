name: CI

# Se ejecuta en cada PR y en cada push a main. Si falla, el PR no debe poder
# fusionarse (activa la protección de rama descrita en docs/CI-CD.md).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build & smoke test (API + Web)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/ci?connection_limit=5
      # Igual que el despliegue de dos Web Apps: el navegador llama a la API pública.
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      API_INTERNAL_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_STORE_THEME: joyeria
      NEXT_TELEMETRY_DISABLED: 1
      ADMIN_EMAIL: admin@turquesa.bo
      ADMIN_PASSWORD: TurquesaAdmin2026!
      ADMIN_NAME: Administrador
      ADMIN_JWT_SECRET: ci-secret-turquesa-2026-cadena-larga-para-firmar-tokens
      ADMIN_TOKEN_TTL_HOURS: 12
      CORS_ORIGIN: http://127.0.0.1:3000

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ci
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uci -pci --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar, validar y aplicar migraciones
        run: |
          pnpm db:generate
          pnpm --filter api exec prisma validate
          pnpm --filter api exec prisma migrate deploy
          pnpm --filter api exec prisma db seed

      - name: Typecheck
        run: pnpm typecheck

      - name: Validar gateway opcional
        run: node --check server.mjs

      - name: Build de la API (flujo de Hostinger)
        env:
          NODE_ENV: production
        run: pnpm --filter api build:deploy

      - name: Build del frontend (flujo de Hostinger)
        env:
          NODE_ENV: production
        run: pnpm --filter web build:deploy

      - name: Smoke test de API y frontend separados
        run: |
          set -euo pipefail

          NODE_ENV=production PORT=3001 pnpm --filter api start > /tmp/api.log 2>&1 &
          API_PID=$!

          NODE_ENV=production PORT=3000 pnpm --filter web start > /tmp/web.log 2>&1 &
          WEB_PID=$!

          trap 'kill "$API_PID" "$WEB_PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/health > /dev/null; then
              break
            fi
            sleep 2
          done

          if ! curl -fsS http://127.0.0.1:3001/api/health; then
            echo "--- API log ---"
            cat /tmp/api.log
            exit 1
          fi

          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              break
            fi
            sleep 2
          done

          if ! curl -fsS http://127.0.0.1:3000/ > /dev/null; then
            echo "--- Web log ---"
            cat /tmp/web.log
            exit 1
          fi

          # Catálogo real desde la API.
          curl -fsS http://127.0.0.1:3001/api/products > /dev/null

          # Login del panel (mismas credenciales que producción).
          curl -fsS -X POST http://127.0.0.1:3001/api/admin/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@turquesa.bo","password":"TurquesaAdmin2026!"}' > /dev/null

          # Preflight CORS: el navegador del frontend debe poder llamar a la API.
          CORS_HEADERS=$(curl -sS -D - -o /dev/null -X OPTIONS \
            http://127.0.0.1:3001/api/products \
            -H 'Origin: http://127.0.0.1:3000' \
            -H 'Access-Control-Request-Method: GET')
          echo "$CORS_HEADERS" | grep -qi 'access-control-allow-origin: http://127.0.0.1:3000'

          kill "$API_PID" "$WEB_PID" 2>/dev/null || true
          wait "$API_PID" "$WEB_PID" 2>/dev/null || true
