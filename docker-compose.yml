# ─────────────────────────────────────────────────────────────────────
# Stack de despliegue para VPS Ubuntu: Nginx (proxy inverso) →
# Web (Next.js) + API (NestJS) → MySQL. Ejecutar: docker compose up -d --build
#
# Antes de arrancar define en un .env junto a este archivo:
#   MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD, ADMIN_EMAIL, ADMIN_PASSWORD y ADMIN_JWT_SECRET.
# El arranque falla de forma explícita si faltan, para no usar credenciales demo.
# ─────────────────────────────────────────────────────────────────────
name: ecommerce-platform

x-api-env: &api-env
  DATABASE_URL: "mysql://${MYSQL_USER:-store}:${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en el .env}@db:3306/${MYSQL_DATABASE:-store}?connection_limit=5"
  PORT: 3001
  NODE_ENV: production
  ADMIN_EMAIL: "${ADMIN_EMAIL:?Define ADMIN_EMAIL en el .env}"
  ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en el .env}"
  ADMIN_NAME: ${ADMIN_NAME:-Administrador}
  ADMIN_JWT_SECRET: "${ADMIN_JWT_SECRET:?Define ADMIN_JWT_SECRET (mínimo 32 caracteres) en el .env}"
  ADMIN_TOKEN_TTL_HOURS: ${ADMIN_TOKEN_TTL_HOURS:-12}

services:
  # ── Base de datos transaccional ──────────────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en el .env}"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-store}
      MYSQL_USER: ${MYSQL_USER:-store}
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en el .env}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── Migraciones + seed (one-shot) ────────────────────────────────────
  db-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-env
    restart: "no"
    command: sh -c "pnpm --filter api prisma:migrate:deploy && pnpm --filter api prisma:seed"
    depends_on:
      db:
        condition: service_healthy

  # ── API Headless (NestJS) ────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *api-env
    restart: unless-stopped
    # Puerto expuesto solo dentro de la red interna (Nginx hace de proxy)
    # Para depurar directamente: descomentar ↓
    # ports: ["3001:3001"]
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  # ── Storefront (Next.js App Router) ─────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Vacío => el storefront llama a /api (mismo origen vía Nginx)
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_STORE_THEME: ${NEXT_PUBLIC_STORE_THEME:-joyeria}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
    restart: unless-stopped

  # ── Proxy inverso ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      - web
      - api

volumes:
  db_data:
