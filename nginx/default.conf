# Proxy inverso para el stack e-commerce en el VPS.
# /        → Next.js (storefront)          ·  /api/*  → NestJS (API headless)

upstream storefront {
    server web:3000;
}

upstream api_service {
    server api:3001;
}

server {
    listen 80;
    server_name _;

    # Subidas (imágenes de producto, etc.)
    client_max_body_size 25M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API headless (NestJS tiene global prefix "api": la URI pasa íntegra)
    location /api/ {
        proxy_pass http://api_service;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }

    # ── Storefront (Next.js)
    location / {
        proxy_pass http://storefront;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # WebSockets (HMR / realtime)
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
